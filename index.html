<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARENA CLUB — Laboratoire d'audit</title><style>*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Arial;background:#f2f5fa;color:#17283c;margin:0}header{background:#11263f;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}header b{font-size:21px}main{max-width:1120px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid #dce4ef;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #1c36510a}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px}button{background:#174e80;color:white;cursor:pointer;border:0}button:hover{background:#103b61}button.alt{background:#e6edf6;color:#193c60}button.warn{background:#a73f3f}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{background:#e4edf7;color:#123f68}nav button.active{background:#174e80;color:white}label{display:block;font-size:13px;color:#516276;margin:10px 0 4px}input,select,textarea{width:100%;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5eaf0;font-size:14px}th{color:#53667d;background:#f7f9fc}.pill{border-radius:30px;padding:4px 10px;background:#e8f2ff;font-size:12px}.notice{background:#f2f7fc;border-left:4px solid #3578aa;padding:12px;border-radius:4px;margin:12px 0}.error{background:#fff0f0;color:#922b2b;padding:12px;border-radius:6px}.success{background:#e8f8f0;color:#116544;padding:12px;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#13263b;color:#e0efff;padding:12px;border-radius:8px;font-size:12px;max-height:260px;overflow:auto}small{color:#64748b}h1{margin:0 0 8px}h2{margin-top:0;font-size:20px}.hide{display:none}.stat{font-size:27px;font-weight:700}a{color:#14609a;cursor:pointer;text-decoration:underline}@media(max-width:750px){.grid,.three{grid-template-columns:1fr}}</style></head><body><header><b>◈ ARENA CLUB</b><span>Portail des adhérents · Environnement de test</span></header><main id="app"></main><script>const members=[{id:125,name:'Lucas Martin',email:'lucas.martin@arena.test',phone:'06 00 00 01 25',sport:'Basketball',paid:120,role:'adherent',medical:'Certificat valide',balance:0},{id:126,name:'Emma Bernard',email:'emma.bernard@arena.test',phone:'06 00 00 01 26',sport:'Judo',paid:150,role:'adherent',medical:'Renouvellement requis',balance:30},{id:127,name:'Hugo Petit',email:'hugo.petit@arena.test',phone:'06 00 00 01 27',sport:'Tennis',paid:100,role:'adherent',medical:'Certificat valide',balance:0},{id:201,name:'Sarah Moreau',email:'sarah.moreau@arena.test',phone:'06 00 00 02 01',sport:'Gestion',paid:0,role:'secretaire',medical:'Non concerné',balance:0},{id:301,name:'Nadia Leroy',email:'nadia.leroy@arena.test',phone:'06 00 00 03 01',sport:'Administration',paid:0,role:'admin',medical:'Non concerné',balance:0}];
const creds=[{login:'lucas',password:'club2026',id:125},{login:'emma',password:'judo2026',id:126},{login:'sarah',password:'bureau2026',id:201},{login:'nadia',password:'admin2026',id:301}];
let actor=null,tab='dashboard',history=[],last=null,records=members.map(m=>({...m})),guarded=false;
const $=id=>document.getElementById(id);const byId=id=>records.find(m=>m.id===Number(id));
function log(method,path,status,body){last={time:new Date().toLocaleTimeString('fr-FR'),method,path,status,body};history.unshift(last);history=history.slice(0,35);}
function response(method,path,code,payload){log(method,path,code,payload);return {code,payload};}
function api(method,path,data={}){
 let u;try{u=new URL(path,'https://arena.local')}catch{return response(method,path,400,{error:'Adresse invalide'})}
 const pathname=u.pathname,id=Number(u.searchParams.get('id'));
 if(!actor)return response(method,path,401,{error:'Authentification requise'});
 if(pathname==='/api/profile'&&method==='GET'){
  const m=byId(id);if(!m)return response(method,path,404,{error:'Profil introuvable'});
  if(guarded&&actor.role!=='admin'&&actor.id!==id)return response(method,path,403,{error:'Accès refusé'});
  return response(method,path,200,{id:m.id,name:m.name,email:m.email,phone:m.phone,sport:m.sport,paid:m.paid});
 }
 if(pathname==='/api/members/export'&&method==='GET'){
  if(guarded&&actor.role!=='admin'&&actor.role!=='secretaire')return response(method,path,403,{error:'Accès refusé'});
  return response(method,path,200,{generatedFor:actor.name,count:records.length,records:records.map(m=>({id:m.id,name:m.name,email:m.email,phone:m.phone,medical:m.medical,balance:m.balance}))});
 }
 if(pathname==='/api/member/update'&&method==='POST'){
  const m=byId(data.id);if(!m)return response(method,path,404,{error:'Profil introuvable'});
  if(guarded&&actor.role!=='admin'&&actor.id!==m.id)return response(method,path,403,{error:'Accès refusé'});
  if(typeof data.phone!=='string'||!/^0[1-9](?:[ .-]?\d{2}){4}$/.test(data.phone))return response(method,path,422,{error:'Téléphone invalide'});
  m.phone=data.phone;return response(method,path,200,{message:'Coordonnées mises à jour',id:m.id,phone:m.phone});
 }
 if(pathname==='/api/finance/discount'&&method==='POST'){
  if(guarded&&actor.role!=='admin')return response(method,path,403,{error:'Accès refusé'});
  const m=byId(data.id);if(!m)return response(method,path,404,{error:'Profil introuvable'});
  if(!Number.isInteger(Number(data.amount))||Number(data.amount)<0||Number(data.amount)>m.paid)return response(method,path,422,{error:'Montant invalide'});
  m.paid-=Number(data.amount);return response(method,path,200,{message:'Remise enregistrée',member:m.name,newPaid:m.paid});
 }
 return response(method,path,404,{error:'Ressource inexistante'});
}
function render(){if(!actor){$('app').innerHTML=`<div class="panel" style="max-width:460px;margin:65px auto"><h1>ARENA CLUB</h1><p class="muted">Portail des adhérents — environnement d'entraînement hors ligne</p><label>Identifiant</label><input id="login" placeholder="Identifiant"><label>Mot de passe</label><input id="password" type="password" placeholder="Mot de passe"><p><button onclick="signin()">Se connecter</button></p><small>Comptes de test : lucas / club2026 · emma / judo2026 · sarah / bureau2026 · nadia / admin2026</small><div id="authError"></div></div>`;return}
$('app').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${actor.name}</b> <span class="pill">${actor.role}</span><div class="muted">Session de laboratoire · ${actor.id}</div></div><button class="alt" onclick="logout()">Changer de compte</button></div></div><nav>${[['dashboard','Tableau de bord'],['profile','Profil'],['directory','Annuaire'],['finance','Cotisations'],['tools','Console API'],['logs','Journal réseau']].map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${t}</button>`).join('')}</nav><div id="screen"></div><div class="panel"><small>Laboratoire pédagogique autonome : toutes les réponses API sont simulées dans ce fichier. Aucune donnée ne quitte le navigateur.</small></div>`;
const s=$('screen');if(tab==='dashboard')s.innerHTML=`<div class="panel"><h2>Bienvenue sur votre espace</h2><p>Consultez vos informations, vos activités et les outils de gestion disponibles.</p><div class="three"><div class="panel"><div class="muted">Adhérents</div><div class="stat">${records.length}</div></div><div class="panel"><div class="muted">Activités</div><div class="stat">4</div></div><div class="panel"><div class="muted">Cotisations</div><div class="stat">2026</div></div></div><div class="notice">Service informatique : une vérification des accès et de la confidentialité est en cours. Les comptes et les données sont fictifs.</div></div>`;
if(tab==='profile'){const id=Number(new URLSearchParams(location.hash.split('?')[1]||'').get('id'))||actor.id;let r=api('GET','/api/profile?id='+id);s.innerHTML=`<div class="panel"><h2>Fiche adhérent</h2><p class="muted">Adresse locale : <code>#profil?id=${id}</code></p><div id="profileResult">${format(r)}</div><p><button class="alt" onclick="navigateProfile(${actor.id})">Revenir à mon profil</button></p></div>`}
if(tab==='directory')s.innerHTML=`<div class="panel"><h2>Annuaire du club</h2><p class="muted">Données publiques de l'association (noms et disciplines).</p><table><tr><th>Nom</th><th>Discipline</th><th>Profil</th></tr>${records.filter(m=>m.role==='adherent').map(m=>`<tr><td>${m.name}</td><td>${m.sport}</td><td><a onclick="navigateProfile(${m.id})">Voir fiche</a></td></tr>`).join('')}</table><p><button class="alt" onclick="exportMembers()">Exporter les coordonnées (gestion interne)</button></p><div id="exportResult"></div></div>`;
if(tab==='finance')s.innerHTML=`<div class="panel"><h2>Gestion des cotisations</h2><p class="muted">Les remises sont réservées à la direction.</p><div class="grid"><div><label>Numéro adhérent</label><input id="discountId" type="number" value="126"></div><div><label>Montant de la remise (€)</label><input id="discountAmount" type="number" value="10"></div></div><p><button onclick="discount()">Enregistrer la remise</button></p><div id="discountResult"></div></div>`;
if(tab==='tools')s.innerHTML=`<div class="panel"><h2>Console de test API</h2><p class="muted">Outil interne de diagnostic. Utilisez uniquement les ressources de ce laboratoire.</p><div class="grid"><div><label>Méthode</label><select id="method"><option>GET</option><option>POST</option></select></div><div><label>Chemin</label><input id="path" value="/api/profile?id=125"></div></div><label>Corps JSON (pour POST)</label><textarea id="payload" rows="5">{"id":125,"phone":"06 00 00 01 25"}</textarea><p><button onclick="runApi()">Exécuter la requête</button></p><div id="apiResult"></div></div>`;
if(tab==='logs')s.innerHTML=`<div class="panel"><h2>Journal des échanges simulés</h2><p class="muted">Dernières opérations du navigateur (simulation de requêtes HTTP).</p><table><tr><th>Heure</th><th>Méthode</th><th>Chemin</th><th>Code</th></tr>${history.map((x,i)=>`<tr><td>${x.time}</td><td>${x.method}</td><td>${escapeHtml(x.path)}</td><td>${x.status}</td></tr>`).join('')}</table><p><button class="alt" onclick="showLast()">Afficher la dernière réponse JSON</button></p><div id="lastResult"></div></div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function format(r){return `<p class="${r.code>=400?'error':'success'}">Réponse simulée : HTTP ${r.code}</p><pre>${escapeHtml(JSON.stringify(r.payload,null,2))}</pre>`}
function signin(){let c=creds.find(x=>x.login===$('login').value.trim()&&x.password===$('password').value);if(!c){$('authError').innerHTML='<p class="error">Identifiants incorrects.</p>';return}actor=byId(c.id);tab='dashboard';history=[];render()}
function logout(){actor=null;tab='dashboard';location.hash='';render()}
function switchTab(t){tab=t;render()}
function navigateProfile(id){tab='profile';location.hash='profil?id='+id;render()}
function exportMembers(){$('exportResult').innerHTML=format(api('GET','/api/members/export'))}
function discount(){$('discountResult').innerHTML=format(api('POST','/api/finance/discount',{id:Number($('discountId').value),amount:Number($('discountAmount').value)}))}
function runApi(){let body={};try{body=JSON.parse($('payload').value||'{}')}catch{$('apiResult').innerHTML='<p class="error">JSON invalide</p>';return}$('apiResult').innerHTML=format(api($('method').value,$('path').value.trim(),body))}
function showLast(){$('lastResult').innerHTML=last?format({code:last.status,payload:last.body}):'<p>Aucune requête.</p>'}
window.addEventListener('hashchange',()=>{if(actor&&location.hash.startsWith('#profil?id=')){tab='profile';render()}});
render();</script></body></html>
